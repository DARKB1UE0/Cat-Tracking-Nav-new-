# pointcloud_to_laserscan 参数配置（优化版）

pointcloud_to_laserscan_node:
  ros__parameters:
    # 目标坐标系
    target_frame: "laser_frame"
    
    # 转换容差
    transform_tolerance: 0.01
    
    # 扫描参数 - 与建图时保持一致，确保 AMCL 定位匹配
    # 车轮读数由 costmap 的 obstacle_min_range=0.5 过滤，不影响避障
    min_height: -0.05
    max_height: 0.05
    
    # 角度范围
    angle_min: -3.14159    # 最小角度 (rad) = -180度
    angle_max: 3.14159     # 最大角度 (rad) = 180度
    angle_increment: 0.004363  # 角度增量 ≈ 0.25度（原0.5度）
    
    # 距离范围 - 与建图时一致
    range_min: 0.55        # 过滤车体立柱（实测 0.46-0.48m），确保完全过滤
    range_max: 15.0        # 减小最大距离（原30.0）
    
    # 扫描时间参数
    scan_time: 0.1         # 扫描时间 (s) = 10Hz
    
    # 使用inf代替nan
    use_inf: true
    
    # 输入点云无穷值处理
    inf_epsilon: 1.0
    
    # QoS 设置 - 使用 RELIABLE 以兼容 slam_toolbox 和 RViz
    qos_overrides:
      /scan:
        publisher:
          reliability: reliable
          durability: volatile
